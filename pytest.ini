[pytest]
# Default options - can be overridden by Jenkins parameters
addopts = --headed --browser chromium --slowmo 200 --html=reports/report.html --self-contained-html --junitxml=reports/results.xml
testpaths = test
python_files = test_*.py *_test.py
python_functions = test_*

# For CI/headless mode, use:
# pytest --headless --browser chromium --html=reports/report.html --self-contained-html --junitxml=reports/results.xml